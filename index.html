<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bé học chữ - chữ a thường tiểu học</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;padding:0;background:#fff;touch-action:none;overflow-x:hidden}
body{font-family:Arial,sans-serif;display:flex;justify-content:center;color:#2f2925}
.app{width:min(760px,100vw);padding:10px 12px 28px}
h1{text-align:center;color:#d3654e;font-size:30px;margin:5px 0}
.sub{text-align:center;color:#8b7b70;font-size:20px;margin-bottom:12px}
.card{background:#fff;border-radius:24px;padding:14px;box-shadow:0 3px 16px rgba(0,0,0,.08)}
.sample{height:105px;display:flex;justify-content:center;align-items:center}
#sample{width:145px;height:105px}
.example{text-align:center;font-size:24px;margin:2px 0 12px}.example b{color:#d3654e}
#board{display:block;width:100%;height:auto;border-radius:18px;touch-action:none}
.info{text-align:center;font-size:18px;font-weight:700;min-height:52px;padding:9px 4px}
.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:10px 15px;font-size:16px;font-weight:700;background:#2563eb;color:#fff}
button.gray{background:#64748b}
button.green{background:#16a34a}
.note{text-align:center;color:#766a63;font-size:14px;margin:10px 5px}
</style>
</head>
<body>
<div class="app">
<h1>⭐ Bé học chữ</h1>
<div class="sub">Học · Nghe · Tập viết</div>
<div class="card">
  <div class="sample"><canvas id="sample" width="290" height="210"></canvas></div>
  <div class="example">Ví dụ: <b>áo</b></div>
  <canvas id="board" width="720" height="610"></canvas>
  <div id="info" class="info">🟢 Chạm vào chấm số 1 để bắt đầu Nét 1</div>
  <div class="controls">
    <button id="speak" class="green">🔊 Nghe chữ a</button>
    <button id="reset">↺ Viết lại</button>
    <button id="toggle" class="gray">👁 Ẩn nét mẫu</button>
  </div>
  <div class="note">Mẫu chữ thường tiểu học: Nét 1 cong kín → Nét 2 móc ngược phải.</div>
</div>

<script>
const c=document.getElementById('board'),ctx=c.getContext('2d');
const sample=document.getElementById('sample'),sx=sample.getContext('2d');
const W=720,H=610;

// 5 horizontal guide lines; writing body uses lines 1,2,3.
const L1=500,L2=420,L3=340,L4=260,L5=180;

// CHỮ a theo đúng cấu trúc mẫu anh gửi:
// Nét 1 = cong kín, nằm giữa đường kẻ 1 và 3.
// Nét 2 = từ điểm dừng ở phía trên bên phải, đi thẳng xuống sát nét cong,
// móc xuống đường kẻ 1 rồi cong ngược lên và kết thúc ở đường kẻ 2.
function stroke1(t){
  const cx=330,cy=420,rx=108,ry=80;
  // bắt đầu ở phía trên-bên phải và đi ngược chiều kim đồng hồ để khép kín
  const a=-0.18 - 2*Math.PI*t;
  return {x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)};
}
function stroke2(t){
  const pts=[
    {x:435,y:340}, // điểm bắt đầu: đường kẻ 3
    {x:435,y:365},
    {x:435,y:405},
    {x:435,y:455},
    {x:435,y:490},
    {x:447,y:500}, // đường kẻ 1
    {x:470,y:500},
    {x:492,y:488},
    {x:505,y:465},
    {x:515,y:440},
    {x:520,y:420}  // dừng ở đường kẻ 2
  ];
  const z=Math.min(pts.length-1-.0001,t*(pts.length-1));
  const i=Math.floor(z),f=z-i;
  return {x:pts[i].x+(pts[i+1].x-pts[i].x)*f,
          y:pts[i].y+(pts[i+1].y-pts[i].y)*f};
}
function makePath(fn,n){let a=[];for(let i=0;i<=n;i++)a.push(fn(i/n));return a}
const P=[makePath(stroke1,180),makePath(stroke2,120)];

function drawGrid(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
 ctx.strokeStyle="#83bdf2";ctx.lineWidth=3;
 [L1,L2,L3,L4,L5].forEach(y=>{
   ctx.beginPath();ctx.moveTo(48,y);ctx.lineTo(675,y);ctx.stroke();
 });
 for(let x=48;x<=675;x+=95){
   ctx.beginPath();ctx.moveTo(x,L5);ctx.lineTo(x,L1);ctx.stroke();
 }
 ctx.fillStyle="#555";ctx.font="22px Arial";ctx.textAlign="center";
 [L1,L2,L3,L4,L5].forEach((y,i)=>ctx.fillText(String(i+1),28,y+7));
}
function drawPath(q,color,width){
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="round";ctx.lineJoin="round";
 ctx.beginPath();ctx.moveTo(q[0].x,q[0].y);
 for(const z of q.slice(1))ctx.lineTo(z.x,z.y);
 ctx.stroke();
}
let stroke=0,drawing=false,started=false,guide=true,progress=0,ink=[];

function draw(){
 drawGrid();
 if(guide){
   drawPath(P[0],"rgba(90,90,90,.16)",15);
   drawPath(P[1],"rgba(90,90,90,.16)",15);
   drawPath(P[stroke],"#202020",6);
 }
 const q=P[stroke];
 // numbered waypoints
 const marks=stroke===0?[0,.33,.66]:[0,.35,.70,1];
 ctx.font="bold 26px Arial";ctx.textAlign="center";
 marks.forEach((m,i)=>{
   const z=q[Math.floor(m*(q.length-1))];
   ctx.beginPath();ctx.arc(z.x,z.y,20,0,Math.PI*2);
   ctx.fillStyle=i===0?"#42a968":"#d3654e";ctx.fill();
   ctx.fillStyle="#fff";ctx.fillText(String(i+1),z.x,z.y+9);
 });
 // small directional arrow along active path
 const a=q[1],b=q[5];
 const ang=Math.atan2(b.y-a.y,b.x-a.x);
 ctx.save();ctx.translate((a.x+b.x)/2,(a.y+b.y)/2);ctx.rotate(ang);
 ctx.fillStyle="#d3654e";ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-8,-8);ctx.lineTo(-8,8);ctx.closePath();ctx.fill();ctx.restore();

 if(ink.length){
   drawPath(ink,"#ef5350",11);
 }
}
function drawSample(){
 sx.clearRect(0,0,290,210);
 const scale=.62, ox=15, oy=5;
 sx.save();sx.translate(ox,oy);sx.scale(scale,scale);
 // sample has no grid; draw exact two-stroke silhouette
 function pathOn(q){
   sx.beginPath();sx.moveTo(q[0].x,q[0].y);
   for(const z of q.slice(1))sx.lineTo(z.x,z.y);
   sx.stroke();
 }
 sx.strokeStyle="#d3654e";sx.lineWidth=15; sx.lineCap="round";sx.lineJoin="round";
 pathOn(P[0]);pathOn(P[1]);sx.restore();
}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearest(z,q){
 let best=1e9,idx=0;
 for(let i=0;i<q.length;i++){const v=dist(z,q[i]);if(v<best){best=v;idx=i}}
 return {d:best,t:idx/(q.length-1)};
}
function down(e){
 e.preventDefault();const z=pos(e),s=P[stroke][0];
 if(!started){
   if(dist(z,s)>75){document.getElementById('info').textContent="👉 Hãy chạm gần chấm xanh số 1 để đặt bút.";return}
   started=true;progress=0;ink=[z];
   document.getElementById('info').textContent=stroke===0?
   "Nét 1: cong kín, đi từ phải sang trái.":"Nét 2: từ đường kẻ 3 đi xuống, móc ngược phải và dừng ở đường kẻ 2.";
 }else ink=[z];
 drawing=true;c.setPointerCapture?.(e.pointerId);draw();
}
function move(e){
 if(!drawing)return;e.preventDefault();const z=pos(e),n=nearest(z,P[stroke]);
 if(n.d<82 && n.t>=progress-.08){progress=Math.max(progress,n.t);ink.push(z)}
 else ink.push(z);
 if(progress>.97)finish();
 draw();
}
function up(e){drawing=false;e.preventDefault()}
function finish(){
 drawing=false;started=false;ink=[];progress=0;
 if(stroke===0){
   stroke=1;
   document.getElementById('info').textContent="⭐ Nét 1 đúng! Bây giờ viết Nét 2.";
 }else{
   document.getElementById('info').textContent="🎉 Giỏi lắm! Bé đã viết đúng chữ a.";
   stroke=0;
 }
 draw();
}
function reset(){
 stroke=0;drawing=false;started=false;progress=0;ink=[];
 document.getElementById('info').textContent="🟢 Chạm vào chấm số 1 để bắt đầu Nét 1";
 draw();
}
c.addEventListener('pointerdown',down,{passive:false});
c.addEventListener('pointermove',move,{passive:false});
c.addEventListener('pointerup',up,{passive:false});
c.addEventListener('pointercancel',up,{passive:false});
for(const ev of ['contextmenu','selectstart'])document.addEventListener(ev,e=>e.preventDefault());
document.getElementById('reset').onclick=reset;
document.getElementById('toggle').onclick=()=>{
 guide=!guide;
 document.getElementById('toggle').textContent=guide?'👁 Ẩn nét mẫu':'👁 Hiện nét mẫu';
 draw();
};
document.getElementById('speak').onclick=()=>{
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance('a, áo');u.lang='vi-VN';u.rate=.72;
 speechSynthesis.speak(u);
};
draw();drawSample();
</script>
</body>
</html>
