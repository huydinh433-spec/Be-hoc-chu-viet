function drawGrid(){
 ctx.clearRect(0,0,board.width,board.height);
 ctx.fillStyle="#fff";ctx.fillRect(0,0,board.width,board.height);
 ctx.strokeStyle="#79b9f2";ctx.lineWidth=2;
 for(let y=35;y<=375;y+=85){ctx.beginPath();ctx.moveTo(18,y);ctx.lineTo(702,y);ctx.stroke();}
 for(let x=18;x<=702;x+=85){ctx.beginPath();ctx.moveTo(x,35);ctx.lineTo(x,375);ctx.stroke();}
 // Exact extracted school-model letter, scaled without changing proportions.
 const scale=1.65;
 const dw=guide.width*scale, dh=guide.height*scale;
 const dx=(board.width-dw)/2+4, dy=board.height-dh-32;
 ctx.globalAlpha=.62;
 ctx.drawImage(guide,dx,dy,dw,dh);
 ctx.globalAlpha=1;
}
guide.onload=drawGrid;

function pos(e){
 const r=board.getBoundingClientRect();
 return {x:(e.clientX-r.left)*board.width/r.width,y:(e.clientY-r.top)*board.height/r.height};
}
board.addEventListener('pointerdown',e=>{
 drawing=true;last=pos(e);board.setPointerCapture(e.pointerId);
});
board.addEventListener('pointermove',e=>{
 if(!drawing)return;
 const p=pos(e);
 ctx.strokeStyle=mode===1?"#1565c0":"#e65100";
 ctx.lineWidth=9;ctx.lineCap="round";ctx.lineJoin="round";
 ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();
 last=p;
});
function stop(){drawing=false;last=null}
board.addEventListener('pointerup',stop);
board.addEventListener('pointercancel',stop);

document.getElementById('s1').onclick=()=>{mode=1;document.getElementById('status').textContent="Đang luyện NÉT 1 – cong kín, từ phải sang trái.";drawGrid()};
document.getElementById('s2').onclick=()=>{mode=2;document.getElementById('status').textContent="Đang luyện NÉT 2 – móc ngược phải.";drawGrid()};
document.getElementById('reset').onclick=()=>{drawGrid();document.getElementById('status').textContent="Nét mẫu được lấy trực tiếp từ chữ “a” trong hình chuẩn."};
document.getElementById('speak').onclick=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("a");u.lang="vi-VN";u.rate=.7;speechSynthesis.speak(u)};
document.addEventListener("selectstart",e=>e.preventDefault());
</script>
