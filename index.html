<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bé học chữ - a thường tiểu học</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;padding:0;background:#fff;touch-action:none;overflow-x:hidden}
body{font-family:Arial,sans-serif;display:flex;justify-content:center;color:#2f2925}
.app{width:min(760px,100vw);padding:10px 12px 25px}
h1{text-align:center;color:#d3654e;font-size:30px;margin:6px 0}
.sub{text-align:center;color:#8b7b70;font-size:20px;margin-bottom:12px}
.card{background:#fff;border-radius:24px;padding:14px;box-shadow:0 3px 16px rgba(0,0,0,.08)}
.letter{text-align:center;font-family:Georgia,serif;font-size:92px;font-weight:700;line-height:1;color:#d3654e}
.example{text-align:center;font-size:24px;margin:2px 0 12px}.example b{color:#d3654e}
#board{display:block;width:100%;height:auto;border-radius:18px;touch-action:none}
.info{text-align:center;font-size:18px;font-weight:700;min-height:48px;padding:9px 4px}
.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:10px 15px;font-size:16px;font-weight:700;background:#2563eb;color:#fff}
button.gray{background:#64748b}
button.green{background:#16a34a}
.note{text-align:center;color:#766a63;font-size:14px;margin:10px 5px}
</style>
</head>
<body>
<div class="app">
<h1>⭐ Bé học chữ</h1>
<div class="sub">Học · Nghe · Tập viết</div>
<div class="card">
  <div class="letter">a</div>
  <div class="example">Ví dụ: <b>áo</b></div>
  <canvas id="board" width="720" height="610"></canvas>
  <div id="info" class="info">🟢 Chạm vào chấm số 1 để bắt đầu Nét 1</div>
  <div class="controls">
    <button id="speak" class="green">🔊 Nghe chữ a</button>
    <button id="reset">↺ Viết lại</button>
    <button id="toggle" class="gray">👁 Ẩn nét mẫu</button>
  </div>
  <div class="note">Mẫu chữ thường tiểu học: Nét 1 cong kín → Nét 2 móc ngược phải.</div>
</div>
<script>
const c=document.getElementById('board'),ctx=c.getContext('2d');
const W=720,H=610;
const lines=[500,420,340,260,180]; // đường kẻ 1..5 từ dưới lên
let stroke=0, drawing=false, started=false, guide=true, progress=0, ink=[];

function p1(t){
  // Nét 1: cong kín. Bắt đầu hơi dưới đường kẻ 3, phía phải;
  // đi từ phải sang trái và khép vòng.
  const cx=330,cy=420,rx=92,ry=80;
  const a=-0.02-Math.PI*2*t;
  return {x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)};
}
function p2(t){
  // Nét 2: từ điểm dừng nét 1 lia lên đường kẻ 3,
  // đi sát bên phải nét cong, móc ngược phải và dừng ở đường kẻ 2.
  const pts=[
    {x:422,y:420},
    {x:422,y:340},
    {x:430,y:365},
    {x:438,y:410},
    {x:438,y:470},
    {x:450,y:500},
    {x:475,y:500},
    {x:495,y:485},
    {x:505,y:455},
    {x:510,y:420}
  ];
  const z=Math.min(pts.length-1-.001,t*(pts.length-1));
  const i=Math.floor(z),f=z-i;
  return {x:pts[i].x+(pts[i+1].x-pts[i].x)*f,y:pts[i].y+(pts[i+1].y-pts[i].y)*f};
}
function path(fn,n){let a=[];for(let i=0;i<=n;i++)a.push(fn(i/n));return a}
const P=[path(p1,180),path(p2,100)];

function line(a,b){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(W-45,b);ctx.stroke()}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
 // 4-line school writing grid
 ctx.strokeStyle="#83bdf2";ctx.lineWidth=3;
 for(const y of lines)line(48,y);
 for(let x=48;x<=675;x+=95){ctx.beginPath();ctx.moveTo(x,180);ctx.lineTo(x,500);ctx.stroke()}
 ctx.fillStyle="#555";ctx.font="22px Arial";ctx.textAlign="center";
 lines.forEach((y,i)=>ctx.fillText(String(i+1),28,y+7));

 if(guide){
   ctx.lineCap="round";ctx.lineJoin="round";
   // ghost full letter
   ctx.strokeStyle="rgba(100,100,100,.18)";ctx.lineWidth=15;
   for(const q of P){ctx.beginPath();ctx.moveTo(q[0].x,q[0].y);for(const z of q.slice(1))ctx.lineTo(z.x,z.y);ctx.stroke()}
   // active stroke
   const q=P[stroke];ctx.strokeStyle="#222";ctx.lineWidth=6;
   ctx.beginPath();ctx.moveTo(q[0].x,q[0].y);for(const z of q.slice(1))ctx.lineTo(z.x,z.y);ctx.stroke();
 }
 // arrows/numbered guide
 const q=P[stroke];
 const marks=stroke===0?[0,.5,1]:[0,.28,.62,1];
 ctx.font="bold 27px Arial";ctx.textAlign="center";
 marks.forEach((m,i)=>{
   const z=q[Math.floor(m*(q.length-1))];
   ctx.beginPath();ctx.arc(z.x,z.y,20,0,Math.PI*2);
   ctx.fillStyle=i===0?"#3eaf67":"#d3654e";ctx.fill();
   ctx.fillStyle="#fff";ctx.fillText(String(i+1),z.x,z.y+9);
 });
 // direction arrow near start
 const s=q[0], next=q[4];
 const ang=Math.atan2(next.y-s.y,next.x-s.x);
 ctx.save();ctx.translate(s.x,s.y);ctx.rotate(ang);
 ctx.fillStyle="#d3654e";ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-15,-8);ctx.lineTo(-15,8);ctx.closePath();ctx.fill();ctx.restore();

 if(ink.length){
   ctx.strokeStyle="#ef5350";ctx.lineWidth=11;ctx.lineCap="round";ctx.lineJoin="round";
   ctx.beginPath();ctx.moveTo(ink[0].x,ink[0].y);
   for(const z of ink.slice(1))ctx.lineTo(z.x,z.y);ctx.stroke();
 }
}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearest(z,q){let best=1e9,idx=0;for(let i=0;i<q.length;i++){let v=d(z,q[i]);if(v<best){best=v;idx=i}}return{d:best,t:idx/(q.length-1)}}
function down(e){
 e.preventDefault();const z=pos(e),s=P[stroke][0];
 if(!started){
   if(d(z,s)>70){document.getElementById('info').textContent="👉 Hãy chạm đúng gần chấm xanh số 1.";return}
   started=true;progress=0;ink=[z];
   document.getElementById('info').textContent=stroke===0?
   "Nét 1: đi từ phải sang trái, khép kín.":"Nét 2: lia lên đường kẻ 3, rồi móc ngược phải.";
 }else{ink=[z]}
 drawing=true;c.setPointerCapture?.(e.pointerId);draw();
}
function move(e){
 if(!drawing)return;e.preventDefault();const z=pos(e),n=nearest(z,P[stroke]);
 if(n.d<82){if(n.t>=progress-.08)progress=Math.max(progress,n.t);ink.push(z)}
 else ink.push(z);
 if(progress>.97)finish();
 draw();
}
function up(e){drawing=false;e.preventDefault()}
function finish(){
 drawing=false;started=false;ink=[];progress=0;
 if(stroke===0){
   stroke=1;document.getElementById('info').textContent="⭐ Nét 1 đúng! Bây giờ viết Nét 2.";
 }else{
   document.getElementById('info').textContent="🎉 Giỏi lắm! Bé đã viết đúng chữ a.";
   stroke=0;
 }
 draw();
}
function reset(){stroke=0;drawing=false;started=false;progress=0;ink=[];document.getElementById('info').textContent="🟢 Chạm vào chấm số 1 để bắt đầu Nét 1";draw()}
c.addEventListener('pointerdown',down,{passive:false});
c.addEventListener('pointermove',move,{passive:false});
c.addEventListener('pointerup',up,{passive:false});
c.addEventListener('pointercancel',up,{passive:false});
for(const ev of ['contextmenu','selectstart'])document.addEventListener(ev,e=>e.preventDefault());
document.getElementById('reset').onclick=reset;
document.getElementById('toggle').onclick=()=>{guide=!guide;document.getElementById('toggle').textContent=guide?'👁 Ẩn nét mẫu':'👁 Hiện nét mẫu';draw()};
document.getElementById('speak').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('a, áo');u.lang='vi-VN';u.rate=.72;speechSynthesis.speak(u)};
draw();
</script>
</body>
</html>
